<style>

    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  .container {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  }

    justify-content: space-between;
    margin-bottom: 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }

    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    margin: 0 12px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;

    background: var(--accent);

  }
  .card {
    background: var(--card);

    align-self: flex-start;
    background: var(--chip-bg);

    font-size: 0.8rem;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 16px;

  .label {

    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 20px;

  }

    line-height: 1.7;
    color: #374151;
    background: #f9fafb;
    border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 14px 16px;

    background: #eef2ff;
    color: #4338ca;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.9em;
  }
  .nav {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  button {
    flex: 1;
    padding: 14px 16px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s, opacity 0.2s;
  }

  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-prev {
    background: #e5e7eb;
    color: #374151;
  }

  .btn-next {
    background: var(--accent);
    color: #fff;
  }

  .counter {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 12px;

    margin-top: 8px;

    font-weight: 500;

    color: #dc2626;
    border-color: #fca5a5;
    background: #fef2f2;
  }
  .empty {
    text-align: center;

// ===== 渲染邏輯 =====
const STORAGE_KEY = "studyProgressIndex";
const total = DATA.length;

// 從 localStorage 讀取上次進度（若無效則從第 1 條開始）
function loadIndex() {
  try {
    const saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    if (!isNaN(saved) && saved >= 0 && saved < total) return saved;
  } catch (e) { /* localStorage 不可用時忽略 */ }
  return 0;
}
let currentIndex = loadIndex();

// 保存進度到 localStorage
function saveIndex() {
  try { localStorage.setItem(STORAGE_KEY, String(currentIndex)); } catch (e) { /* 忽略 */ }
}

const typeEl = document.getElementById("type");
const outlineEl = document.getElementById("outline");
const interpEl = document.getElementById("interpretation");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const counterEl = document.getElementById("counter");
const percentEl = document.getElementById("percent");
const progressFill = document.getElementById("progressFill");
const positionEl = document.getElementById("position");
const resetBtn = document.getElementById("resetBtn");

function render() {
  const item = DATA[currentIndex];
  typeEl.textContent = item.type;
  outlineEl.textContent = item.outline;
  interpEl.innerHTML = item.interpretation.replace(/`([^`]+)`/g, "<code>$1</code>");
  counterEl.textContent = `${currentIndex + 1} / ${total}`;
  const pct = Math.round(((currentIndex + 1) / total) * 100);
  percentEl.textContent = pct + "%";
  progressFill.style.width = pct + "%";
  positionEl.textContent = `第 ${currentIndex + 1} 條，共 ${total} 條`;
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === total - 1;
}

prevBtn.addEventListener("click", () => {
  if (currentIndex > 0) { currentIndex--; render(); saveIndex(); }
});
nextBtn.addEventListener("click", () => {
  if (currentIndex < total - 1) { currentIndex++; render(); saveIndex(); }
});

// 重置進度（回到第 1 條）
resetBtn.addEventListener("click", () => {
  if (confirm("確定要重置進度，回到第 1 條嗎？")) {
    currentIndex = 0;
    render();
    saveIndex();
  }
});

// 鍵盤導航
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") prevBtn.click();
  if (e.key === "ArrowRight") nextBtn.click();
});

render();
</script>
