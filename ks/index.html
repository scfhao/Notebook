<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考前练习</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f0f2f5;
    color: #333;
    min-height: 100vh;
}
.container { max-width: 860px; margin: 0 auto; padding: 20px; }
.header {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; padding: 16px 24px; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
}
.header h1 { font-size: 20px; color: #1a1a2a; }
.header .progress { font-size: 14px; color: #666; }
.card {
    background: #fff; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 28px; margin-bottom: 20px;
}
.type-badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 13px; font-weight: 600; margin-bottom: 14px;
}
.type-single { background: #e3f2fd; color: #1565c0; }
.type-multi { background: #fce4ec; color: #c2185b; }
.question-text { font-size: 17px; line-height: 1.7; margin-bottom: 20px; color: #1a1a2a; }
.options { display: flex; flex-direction: column; gap: 12px; }
.option {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 10px;
    cursor: pointer; transition: all 0.15s ease; background: #fff;
    font-size: 15px; line-height: 1.6;
}
.option:hover { border-color: #90caf9; background: #f5f9ff; }
.option.selected { border-color: #1976d2; background: #e3f2fd; }
.option.correct { border-color: #4caf50; background: #e8f5e9; }
.option.wrong { border-color: #f44336; background: #ffebee; }
.option .letter {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    background: #e0e2e5; display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px; color: #555;
}
.option.selected .letter { background: #1976d2; color: #fff; }
.option.correct .letter { background: #4caf50; color: #fff; }
.option.wrong .letter { background: #f44336; color: #fff; }
.option input { display: none; }
.option .opt-text { flex: 1; }
.buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
.btn {
    padding: 10px 22px; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: #1976d2; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #1565c0; }
.btn-warning { background: #ff9800; color: #fff; }
.btn-warning:hover:not(:disabled) { background: #f57c00; }
.btn-outline { background: #fff; color: #555; border: 2px solid #e0e0e0; }
.btn-outline:hover:not(:disabled) { border-color: #1976d2; color: #1976d2; }
.btn-nav { background: #f5f5f5; color: #333; }
.btn-nav:hover:not(:disabled) { background: #e0e0e0; }
.result-box {
    margin-top: 20px; padding: 16px 20px; border-radius: 10px;
    font-size: 15px; line-height: 1.7; display: none;
}
.result-correct { background: #e8f5e9; border: 2px solid #a5d6a7; color: #1b5e20; }
.result-wrong { background: #ffebee; border: 2px solid #ef9a9a; color: #b71c1c; }
.result-info { background: #fff3e0; border: 2px solid #ffcc80; color: #e65100; }
.result-box .analysis { margin-top: 6px; }
.modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 1000;
    align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
    background: #fff; border-radius: 16px; width: 90%; max-width: 640px;
    max-height: 80vh; display: flex; flex-direction: column;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px; border-bottom: 1px solid #eee;
}
.modal-header h2 { font-size: 18px; }
.modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; line-height: 1; }
.modal-close:hover { color: #333; }
.modal-body { padding: 20px 24px; overflow-y: auto; }
.answer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 10px; }
.answer-cell {
    width: 100%; aspect-ratio: 1; border: 2px solid #e0e0e0; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; cursor: pointer; background: #fff; color: #333;
    transition: all 0.15s ease;
}
.answer-cell:hover { border-color: #1976d2; }
.answer-cell.unanswered { background: #9e9e9e; color: #fff; border-color: #9e9e9e; }
.answer-cell.correct { background: #4caf50; color: #fff; border-color: #4caf50; }
.answer-cell.wrong { background: #f44336; color: #fff; border-color: #f44336; }
.answer-cell.current { outline: 3px solid #1976d2; outline-offset: 2px; }
.legend { display: flex; gap: 20px; margin-top: 16px; font-size: 13px; color: #666; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
.legend-dot.gray { background: #9e9e9e; }
.legend-dot.green { background: #4caf50; }
.legend-dot.red { background: #f44336; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📝 考前练习</h1>
        <div class="progress" id="progress">第 1 / 300 题</div>
    </div>
    <div class="card">
        <span class="type-badge" id="typeBadge">单选</span>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="options"></div>
        <div class="result-box" id="resultBox"></div>
        <div class="buttons">
            <button class="btn btn-nav" id="prevBtn" onclick="prevQuestion()">⬅ 上一题</button>
            <button class="btn btn-primary" id="btnSubmit" onclick="submitAnswer()">提交</button>
            <button class="btn btn-warning" id="btnAnalysis" onclick="showAnalysis()">查看解析</button>
            <button class="btn btn-outline" id="btnSheet" onclick="openSheet()">答题卡</button>
            <button class="btn btn-nav" id="nextBtn" onclick="nextQuestion()">下一题 ➡</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="sheetOverlay" onclick="if(event.target===this)closeSheet()">
    <div class="modal">
        <div class="modal-header">
            <h2>答题卡</h2>
            <button class="modal-close" onclick="closeSheet()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="answer-grid" id="answerGrid"></div>
            <div class="legend">
                <span class="legend-item"><span class="legend-dot gray"></span> 未答</span>
                <span class="legend-item"><span class="legend-dot green"></span> 正确</span>
                <span class="legend-item"><span class="legend-dot red"></span> 错误</span>
            </div>
        </div>
    </div>
</div>

 "D.缺陷", "E.资金"], "answer": "ABCD"}, {"type": "多选", "question": "如要确保关系数据库的引用完整性（Referential Integrity），需使用到以下哪些键（Key）？", "options": ["A.候选键（Candidate Key）", "B.次要键（Secondary Key）", "C.主键（Primary Key）", "D.外键（Foreign Key）", "E.索引（Index）"], "answer": "CD"}, {"type": "多选", "question": "基于Hadoop开源大数据平台主要提供了针对数据分布式计算和存储能力，如下属于分布式存储组件的有？", "options": ["A.MR", "B.SPARK", "C.HDFS", "D.HBase", "E.Flink"], "answer": "CD"}, {"type": "多选", "question": "企业要设计一个从数据产生到传递的数据流，以下哪些选项为常见流程？", "options": ["A.资料源", "B.通讯协议", "C.前处理", "D.储存方式", "E.存取方式"], "answer": "ABCDE"}, {"type": "多选", "question": "关于where和having子句说法正确的有？", "options": ["A.WHERE子句可用于限制行和组", "B.WHERE子句只能用于限制行。", "C.HAVING子句可用于限制行和组。", "D.HAVING子句只能用于限制组。", "E.如果查询使用HAVING子句，则不能在查询中使用WHERE子句。", "F.HAVING子句不能在子查询中使用。"], "answer": "BD"}, {"type": "多选", "question": "下面是有关变量的描述，请问哪些描述是正确的？", "options": ["A.临时变量是指仅在某个SQL语句中有效的变量", "B.临时变量是在某个会话期间有效的变量", "C.已定义变量是指明确定义，其生命期至显式地删除、重新定义或退出SQL*Plus为止", "D.已定义的变量是不能被删除的", "E.已定义变量是指明确定义，其生命期一直存在"], "answer": "BC"}, {"type": "多选", "question": "关于OLAP的特性,下面正确的是", "options": ["A.快速性", "B.可分析性", "C.多维性", "D.信息性", "E.共享性"], "answer": "ABCDE"}, {"type": "多选", "question": "何谓数据定义语言(DDL)？", "options": ["A.用来定义关联表的纲要", "B.用来控制数据库对象的权限", "C.用来定义数据库的对象", "D.用来处理数据库的关联表", "E.查询数据库的数据"], "answer": "AC"}, {"type": "多选", "question": "SQL包括以下(  )部分", "options": ["A.&nbsp;&nbsp; DDL", "B.DML", "C.DQL", "D.DCL", "E.ACL"], "answer": "ABCD"}, {"type": "多选", "question": "观察STUDENT表的表结构：<br>STD_ID     NUMBER(4)<br>COURSE_ID     VARCHAR2(10)<br>START_DATE     DATE<br>END_DATE     DATE<br>下面聚合函数的使用正确的有？", "options": ["A.SUM(start_date)", "B.AVG(start_date)", "C.COUNT(start_date)", "D.AVG(start_date, end_date)", "E.MIN(start_date)", "F.MAXIMUM(start_date)"], "answer": "ABCD"}, {"type": "多选", "question": "下列工作中属于项目的是", "options": ["A.策划一场婚礼", "B.为人民服务", "C.开发一个软件", "D.主持一次会议", "E.管理大楼的卫生服务"], "answer": "ACD"}, {"type": "多选", "question": "下列查询姓张的学生的语句不正确的是？", "options": ["A.select * from 表名 where 姓名 = &# let currentIndex = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let statuses = new Array(QUESTIONS.length).fill('unanswered');

function render() {
    const q = QUESTIONS[currentIndex];
    document.getElementById('progress').textContent = '第 ' + (currentIndex + 1) + ' / ' + QUESTIONS.length + ' 题';
    const badge = document.getElementById('typeBadge');
    badge.textContent = q.type;
    badge.className = 'type-badge ' + (q.type === '单选' ? 'type-single' : 'type-multi');
    document.getElementById('questionText').innerHTML = q.question;

    const optsDiv = document.getElementById('options');
    optsDiv.innerHTML = '';
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    q.options.forEach(function(opt, idx) {
        const letter = letters[idx];
        const div = document.createElement('div');
        div.className = 'option';
        div.dataset.letter = letter;
        div.innerHTML = '<span class="letter">' + letter + '</span><span class="opt-text">' + opt + '</span>';
        div.onclick = function() { toggleOption(letter); };
        optsDiv.appendChild(div);
    });

    const sel = answers[currentIndex];
    if (sel) {
        sel.split('').forEach(function(l) {
            const opt = optsDiv.querySelector('.option[data-letter="' + l + '"]');
            if (opt) opt.classList.add('selected');
        });
    }

    const resultBox = document.getElementById('resultBox');
    if (statuses[currentIndex] !== 'unanswered') {
        resultBox.style.display = 'block';
        if (statuses[currentIndex] === 'correct') {
            resultBox.className = 'result-box result-correct';
            resultBox.innerHTML = '<div class="analysis">✅ 回答正确！</div>';
        } else {
            resultBox.className = 'result-box result-wrong';
            resultBox.innerHTML = '<div class="analysis">❌ 回答错误，正确答案是：<strong>' + q.answer + '</strong></div>';
        }
        markOptionResult();
    } else {
        resultBox.style.display = 'none';
    }

    document.getElementById('prevBtn').disabled = currentIndex === 0;
    document.getElementById('nextBtn').disabled = currentIndex === QUESTIONS.length - 1;
}

function toggleOption(letter) {
    if (statuses[currentIndex] !== 'unanswered') return;
    const q = QUESTIONS[currentIndex];
    let sel = answers[currentIndex] || '';
    if (q.type === '单选') {
        answers[currentIndex] = letter;
        const opts = document.querySelectorAll('#options .option');
        opts.forEach(function(o) { o.classList.remove('selected'); });
        document.querySelector('#options .option[data-letter="' + letter + '"]').classList.add('selected');
    } else {
        let arr = sel ? sel.split('') : [];
        if (arr.indexOf(letter) >= 0) {
            arr = arr.filter(function(l) { return l !== letter; });
        } else {
            arr.push(letter);
        }
        arr.sort();
        answers[currentIndex] = arr.join('');
        const opt = document.querySelector('#options .option[data-letter="' + letter + '"]');
        opt.classList.toggle('selected');
    }
}

function markOptionResult() {
    const q = QUESTIONS[currentIndex];
    const opts = document.querySelectorAll('#options .option');
    opts.forEach(function(o) {
        o.classList.remove('selected', 'correct', 'wrong');
        o.style.pointerEvents = 'none';
        if (q.answer.indexOf(o.dataset.letter) >= 0) {
            o.classList.add('correct');
        } else if (answers[currentIndex] && answers[currentIndex].indexOf(o.dataset.letter) >= 0) {
            o.classList.add('wrong');
        }
    });
}

function submitAnswer() {
    if (statuses[currentIndex] !== 'unanswered') return;
    const q = QUESTIONS[currentIndex];
    const sel = answers[currentIndex];
    if (!sel) { alert('请先选择答案！'); return; }
    const isCorrect = sel === q.answer;
    statuses[currentIndex] = isCorrect ? 'correct' : 'wrong';

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';
    if (isCorrect) {
        resultBox.className = 'result-box result-correct';
        resultBox.innerHTML = '<div class="analysis">✅ 回答正确！</div>';
        markOptionResult();
        setTimeout(function() {
            if (currentIndex < QUESTIONS.length - 1) { currentIndex++; render(); }
        }, 600);
    } else {
        resultBox.className = 'result-box result-wrong';
        resultBox.innerHTML = '<div class="analysis">❌ 回答错误，正确答案是：<strong>' + q.answer + '</strong></div>';
        markOptionResult();
    }
}

function showAnalysis() {
    const q = QUESTIONS[currentIndex];
    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';
    if (statuses[currentIndex] === 'correct') {
        resultBox.className = 'result-box result-correct';
        resultBox.innerHTML = '<div class="analysis">✅ 回答正确！</div>';
    } else if (statuses[currentIndex] === 'wrong') {
        resultBox.className = 'result-box result-wrong';
        resultBox.innerHTML = '<div class="analysis">❌ 回答错误，正确答案是：<strong>' + q.answer + '</strong></div>';
    } else {
        resultBox.className = 'result-box result-info';
        resultBox.innerHTML = '<div class="analysis">正确答案是：<strong>' + q.answer + '</strong></div>';
        markOptionResult();
    }
}

function prevQuestion() { if (currentIndex > 0) { currentIndex--; render(); } }
function nextQuestion() { if (currentIndex < QUESTIONS.length - 1) { currentIndex++; render(); } }

function openSheet() {
    const grid = document.getElementById('answerGrid');
    grid.innerHTML = '';
    QUESTIONS.forEach(function(q, i) {
        const cell = document.createElement('div');
        cell.className = 'answer-cell ' + statuses[i];
        cell.textContent = i + 1;
        if (i === currentIndex) cell.classList.add('current');
        cell.onclick = function() { currentIndex = i; closeSheet(); render(); };
        grid.appendChild(cell);
    });
    document.getElementById('sheetOverlay').classList.add('show');
}

function closeSheet() {
    document.getElementById('sheetOverlay').classList.remove('show');
}

render();
</script>
